name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -vE '^\s*$' build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          cat build.log
          exit $code
        env:
          CI: "false"
          # Set REACT_APP_API_BASE_URL under Settings > Secrets and variables > Actions > Variables
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
          # The site is served at the root of https://joindeltacloud.com (custom domain),
          # so assets load from "/" rather than "/DeltaCloud".
          PUBLIC_URL: ""
      - run: cp build/index.html build/404.html   # single-page-app fallback
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/build }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
