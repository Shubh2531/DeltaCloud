services:
  - type: web
    name: deltacloud-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MARKET_SOURCE, value: auto }
      - { key: MONGO_URI, sync: false }
      - { key: CLIENT_ORIGINS, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: REFRESH_SECRET, generateValue: true }
